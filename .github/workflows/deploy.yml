# CI/CD Pipeline: Build → Push → Deploy

name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  ACR_LOGINSERVER: ${{ secrets.ACR_LOGINSERVER }}
  IMAGE_NAME: webco-cms
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  RESOURCE_GROUP: webco-cms-rg
  CONTAINER_APP_NAME: webco-cms-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # CHECKOUT THE CODE
      - name: Checkout code
        uses: actions/checkout@v3

    # BUILD AND PUSH DOCKER IMAGE TO ACR

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

    # LOG IN TO ACR

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ACR_LOGINSERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

    # BUILD AND PUSH THE IMAGE

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: ./cms
          push: true
          tags: ${{ env.ACR_LOGINSERVER }}/${{ env.IMAGE_NAME }}:latest


    # DEPLOY TO AZURE CONTAINER APPS

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v1
        with:
          inlineScript: |
            az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
            az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.ACR_LOGINSERVER }}/${{ env.IMAGE_NAME }}:latest

   # OPTIONAL: VERIFY DEPLOYMENT

      - name: Verify deployment
        uses: azure/cli@v1
        with:
          inlineScript: |
            az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
            az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}

    #Print the Deployment summary
      - name: Print deployment summary
        run: |
          echo "Deployment to Azure Container Apps completed successfully!"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo "Image Deployed: ${{ env.ACR_LOGINSERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "=================================================="       
        
