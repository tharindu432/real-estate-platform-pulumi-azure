version: "3.8"
services:

  # 1. posgresSQL DB
  postgres:
    image: postgres:15-alpine
    container_name: webco_postgres
    environment:
      POSTGRES_USER: directus_admin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: cms_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus_admin -d cms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: webco_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. Directus CMS
  directus:
    image: directus/directus:latest
    container_name: webco_directus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: supersecretkey
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: directus_admin
      DB_PASSWORD: localdevpassword
      DB_DATABASE: cms_db
      CACHE_ENABLED: "true"
      CACHE_TYPE: redis
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: 6379
      ADMIN_EMAIL: "admin@webco.com"
      ADMIN_PASSWORD: "adminpassword"
      PUBLIC_URL: "http://localhost:8055"
    volumes:
      - directus_uploads:/directus/uploads
    restart: unless-stopped

volumes:
  postgres_data: 
    driver: local
  redis_data: 
    driver: local
  directus_uploads: 
    driver: local